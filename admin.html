<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Slobodno Misto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/slobodno.css" />
  <script src="js/lang.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card admin-panel">
    <a href="main.html" class="auth-back">← Aplikacija</a>
    <h1>Admin</h1>
    <p class="auth-sub" id="admin-stats">Učitavam…</p>
    <div id="admin-denied" hidden>
      <p class="auth-error"><span class="t-hr">Samo admin. </span><span class="t-en">Admin only. </span><a href="login.html?next=admin.html">Prijava</a></p>
    </div>
    <table class="admin-table" id="users-table" hidden>
      <thead>
        <tr><th>Ime</th><th>Email</th><th>Bodovi</th><th>Uloga</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="js/api.js"></script>
  <script>
    (async function () {
      try {
        var data = await SlobodnoApi.adminUsers();
        document.getElementById('admin-stats').textContent =
          'Korisnika: ' + data.users.length + ' · Aktivna mjesta: ' + data.activeSpots;
        var tbody = document.querySelector('#users-table tbody');
        data.users.forEach(function (u) {
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + u.name + '</td><td>' + u.email + '</td>' +
            '<td><input type="number" min="0" value="' + u.points + '" data-id="' + u.id + '" /></td>' +
            '<td>' + u.role + '</td>' +
            '<td><button type="button" class="btn-save">Spremi</button></td>';
          tr.querySelector('.btn-save').addEventListener('click', async function () {
            var pts = parseInt(tr.querySelector('input').value, 10);
            await SlobodnoApi.adminSetPoints(u.id, pts);
            alert('Spremljeno.');
          });
          tbody.appendChild(tr);
        });
        document.getElementById('users-table').hidden = false;
      } catch (e) {
        document.getElementById('admin-denied').hidden = false;
        document.getElementById('admin-stats').textContent = e.message;
      }
    })();
  </script>
</body>
</html>
