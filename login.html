<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prijava — Slobodno Misto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/slobodno.css" />
  <script src="js/lang.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a href="main.html" class="auth-back">← Slobodno Misto</a>
    <h1><span class="t-hr">Prijava</span><span class="t-en">Log in</span></h1>
    <p class="auth-sub"><span class="t-hr">Split — parking scout i Polza bodovi</span><span class="t-en">Split — parking scout & Polza points</span></p>
    <form id="login-form">
      <label><span class="t-hr">Email</span><span class="t-en">Email</span><input type="email" name="email" required autocomplete="email" /></label>
      <label><span class="t-hr">Lozinka</span><span class="t-en">Password</span><input type="password" name="password" required minlength="6" autocomplete="current-password" /></label>
      <p class="auth-error" id="auth-error" hidden></p>
      <button type="submit" class="btn btn-primary"><span class="t-hr">Prijavi se</span><span class="t-en">Log in</span></button>
    </form>
    <p class="auth-footer">
      <span class="t-hr">Nemaš račun? </span><span class="t-en">No account? </span>
      <a href="register.html"><span class="t-hr">Registracija</span><span class="t-en">Sign up</span></a>
    </p>
    <p class="auth-hint"><span class="t-hr">Demo admin: admin@split.hr / admin123</span><span class="t-en">Demo admin: admin@split.hr / admin123</span></p>
  </main>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = document.getElementById('auth-error');
      err.hidden = true;
      var fd = new FormData(e.target);
      try {
        await SlobodnoApi.login(fd.get('email'), fd.get('password'));
        var next = new URLSearchParams(location.search).get('next') || 'main.html';
        location.href = next;
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
